name: Build and Release Local Harness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: "Build and Release"
    runs-on: ubuntu-24.04
    environment: flatpak-signing
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Build the harness binary
      run: cargo build --release --locked

    - name: Run regression tests
      run: cargo test --release --locked

    - name: Stage the Flatpak binary
      run: cp target/release/harness packaging/flatpak/harness

    - name: Flatpak Build Environment
      uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
      with:
        image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
        options: -v ${{ github.workspace }}:/workspace --privileged
        run: |
          cd /workspace

          # 1. Import the signing key from the repository secret.
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          FPR=65269CFC0D32C2CA632C48C5F8AF682DDA82A240

          # 2. Runtimes.
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Sdk//51 org.gnome.Platform//51

          # 3. Build, sign, and bundle.
          flatpak-builder --user --disable-rofiles-fuse \
            --repo=deploy-repo \
            --gpg-sign="$FPR" \
            --default-branch=stable \
            --force-clean build-dir packaging/flatpak/org.jonathonp3.LocalHarness.json || exit 1
          flatpak build-update-repo --gpg-sign="$FPR" deploy-repo
          flatpak build-bundle deploy-repo local-harness-stable.flatpak org.jonathonp3.LocalHarness stable

          # 4. Publishable signed-repo descriptor and public key.
          gpg --dearmor < packaging/flatpak/local-harness.gpg | base64 -w0 > /tmp/key.b64
          cat > deploy-repo/local-harness.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Local Harness
          Url=https://jonathonp3.github.io/sirius-os-localharness/
          Homepage=https://github.com/jonathonp3/sirius-os-localharness
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          GPGKey=$(cat /tmp/key.b64)
          EOF
          cp packaging/flatpak/local-harness.gpg deploy-repo/key.gpg

          cat > deploy-repo/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><meta charset="utf-8"><title>Local Harness</title>
          <style>body{font:16px system-ui;max-width:720px;margin:60px auto;padding:0 20px;background:#111;color:#eee}a{color:#6ea8fe}pre{background:#1a1a1a;padding:12px;border-radius:8px;overflow:auto}</style>
          <h1>Local Harness</h1>
          <p>Signed Flatpak repository for <code>org.jonathonp3.LocalHarness</code>.</p>
          <pre>flatpak remote-add --if-not-exists local-harness \
            https://jonathonp3.github.io/sirius-os-localharness/local-harness.flatpakrepo
          flatpak install local-harness org.jonathonp3.LocalHarness</pre>
          <p><a href="https://github.com/jonathonp3/sirius-os-localharness">Source</a> · key <code>65269CFC0D32C2CA632C48C5F8AF682DDA82A240</code></p>
          </html>
          HTML
          touch deploy-repo/.nojekyll

          ls -R deploy-repo
          chmod -R 777 /workspace/deploy-repo
          chmod 666 /workspace/local-harness-stable.flatpak

    - name: Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: latest-build
        name: "Local Harness - Latest"
        files: |
          local-harness-stable.flatpak
          packaging/flatpak/local-harness.gpg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy signed repo to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
      with:
        folder: deploy-repo
        branch: gh-pages
