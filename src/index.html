<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Harness</title>
<style>
:root { color-scheme: dark; --bg:#111; --panel:#1a1a1a; --text:#e8e8e8; --muted:#9a9a9a; --accent:#6ea8fe; --border:#2a2a2a;
--code-bg:#0d0d0d; --code-text:#e6e6e6; --code-comment:#8b949e; --code-keyword:#ff7b72; --code-string:#a5d6ff; --code-number:#79c0ff; --code-title:#d2a8ff; --code-type:#ffa657; --code-builtin:#79c0ff; --code-meta:#d2a8ff; --code-attr:#79c0ff; --code-tag:#7ee787; --code-regexp:#ffa657; --code-variable:#ffa657; --code-addition:#aff5b4; --code-deletion:#ffdcd7; --ok:#68d391; }
* { box-sizing: border-box; }
body { margin:0; box-sizing:border-box; font:15px/1.5 ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
header { padding:12px 18px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; }
header h1 { font-size:14px; font-weight:600; margin:0; }
#status { color:var(--muted); font-size:14px; margin-left:auto; }
#status.error { color:#ff6b6b; }
#log { flex:1; min-height:0; overflow:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
.bubble { max-width:min(760px, 92%); padding:10px 12px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
.user { align-self:flex-end; background:transparent; border:1px solid var(--border); color:var(--muted); font-size:14px; line-height:1.45; position:relative; padding:8px 58px 8px 10px; opacity:.9; white-space:pre-wrap; word-break:break-word; tab-size:2; }
.bubble-copy { position:absolute; top:4px; right:5px; background:var(--bg); color:var(--muted); border:1px solid var(--border); border-radius:4px; font-size:11px; padding:1px 5px; cursor:pointer; }
.bubble-copy:hover { color:var(--text); }
.assistant { align-self:flex-start; position:relative; background:var(--panel); border:1px solid var(--border); color:var(--text); font-size:16px; line-height:1.6; white-space:normal; padding-right:64px; }
.assistant-copy { position:absolute; top:6px; right:6px; background:var(--bg); color:var(--muted); border:1px solid var(--border); border-radius:4px; font-size:11px; padding:2px 6px; cursor:pointer; opacity:.7; }
.assistant-copy:hover { color:var(--text); opacity:1; }
.tool { align-self:flex-start; font:12px ui-monospace, monospace; color:var(--muted); background:#151515; border:1px dashed var(--border); padding:4px 8px; border-radius:6px; max-width:92%; white-space:pre-wrap; }
.meta { align-self:flex-start; color:var(--muted); font-size:14px; }
.error { align-self:flex-start; color:#ffb3b3; background:#2a1515; border:1px solid #5a2a2a; padding:8px 10px; border-radius:8px; white-space:pre-wrap; }
.assistant pre { position:relative; }
.assistant table { border-collapse:collapse; margin:0 0 8px; display:block; overflow:auto; }
.assistant th, .assistant td { border:1px solid var(--border); padding:4px 8px; }
.assistant th { background:#1f1f1f; }
.assistant blockquote { margin:0 0 8px; padding-left:10px; border-left:2px solid var(--border); color:var(--muted); }
.assistant a { color:var(--accent); }
.assistant hr { border:0; border-top:1px solid var(--border); margin:10px 0; }
.copy-btn { position:absolute; top:4px; right:4px; background:#2a2a2a; color:var(--muted); border:1px solid var(--border); border-radius:4px; font-size:10px; padding:2px 6px; cursor:pointer; opacity:0; transition:opacity .15s; }
.assistant pre:hover .copy-btn, .copy-btn:focus { opacity:1; }
.tool-card { align-self:flex-start; width:min(760px,92%); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:13px ui-monospace, monospace; color:var(--muted); }
.tool-card summary { cursor:pointer; padding:6px 10px; color:var(--text); }
.tool-card[open] summary { border-bottom:1px solid var(--border); }
.tool-card summary { font-size:14px; }
.tool-card summary code { color:var(--accent); }
.tool-status { font-size:12px; color:var(--muted); margin-left:6px; }
.tool-status.ok { color:var(--ok); font-weight:600; }
.tool-status.error { color:#fc8181; }
.tool-block { padding:6px 10px; }
.tool-label { text-transform:uppercase; font-size:11px; letter-spacing:.08em; color:var(--muted); margin-bottom:2px; display:flex; justify-content:space-between; align-items:center; gap:6px; user-select:none; }
.tool-buttons { display:flex; flex-wrap:wrap; gap:5px; user-select:none; }
.tool-card summary { user-select:none; }
.tool-result-text { font-size:14px; }
.tool-card pre { margin:0; background:var(--code-bg); color:var(--code-text); border:1px solid var(--border); border-radius:6px; padding:8px; max-height:320px; overflow:auto; white-space:pre; tab-size:2; }
.tool-copy { float:none; text-transform:none; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:5px; font-size:14px; padding:4px 10px; cursor:pointer; }
.approval-card.resolved { opacity:.85; }
.approval-card { align-self:flex-start; width:min(760px,92%); background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px; color:var(--text); }
.approval-title { color:var(--accent); font-weight:600; margin-bottom:4px; }
.approval-reason { color:var(--muted); font-size:13px; margin-bottom:6px; }
.approval-card pre { margin:0 0 8px; background:var(--code-bg); color:var(--code-text); border:1px solid var(--border); border-radius:6px; padding:8px; white-space:pre-wrap; max-height:240px; overflow:auto; }
.approval-actions { display:flex; gap:8px; }
.approval-actions button { padding:5px 12px; border:0; border-radius:6px; cursor:pointer; font-weight:600; }
.approval-actions button[data-decision="approve"] { background:#68d391; color:#08110c; }
.approval-actions button[data-decision="deny"] { background:#3a3a3a; color:var(--text); }
.approval-actions button:disabled { opacity:.5; cursor:default; }
#stop, #send { padding:0 12px; }
#spell, #stop, #send { flex:0 0 auto; min-width:64px; min-height:48px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; }
#stop:disabled { background:var(--panel); color:var(--text); border:1px solid var(--border); opacity:1; }
textarea::placeholder { color:var(--muted); opacity:1; }
#prompt::placeholder { color:#81858c; opacity:1; font-size:15px; font-weight:400; }
#spell { background:#3a3a3a; color:var(--text); padding:0 12px; }
#spell.active { background:var(--accent); color:#08111f; }

#history-toggle { background:var(--panel); color:var(--text); border:1px solid var(--border); padding:0 10px; font-size:13px; }
#history-panel { position:fixed; top:0; left:0; bottom:0; width:350px; z-index:1000; display:flex; flex-direction:column; gap:9px; padding:14px; background:var(--panel); border-right:1px solid var(--border); box-shadow:0 12px 40px rgba(0,0,0,.35); box-sizing:border-box; }
body.sidebar-open { padding-left:350px; }
#history-panel[hidden] { display:none; }
.workspace-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.workspace-head strong { font-size:16px; }
#workspace-add { background:var(--bg); color:var(--text); border:1px solid var(--border); min-width:30px; min-height:28px; padding:0 8px; font-size:18px; line-height:1; }
#workspace-list { display:flex; flex-direction:column; gap:2px; max-height:190px; overflow:auto; }
.workspace-item { display:flex; flex-direction:column; align-items:flex-start; gap:1px; width:100%; text-align:left; background:none; color:var(--text); border:1px solid transparent; border-radius:6px; padding:6px 7px; font:inherit; cursor:pointer; }
.workspace-item:hover { background:var(--bg); }
.workspace-item.active { background:var(--bg); border-color:var(--border); box-shadow:inset 3px 0 0 var(--accent); }
.workspace-row { display:flex; align-items:stretch; gap:2px; width:100%; }
.workspace-row .workspace-item { flex:1; width:auto; min-width:0; }
.workspace-delete { background:none; color:var(--muted); border:1px solid transparent; border-radius:6px; width:28px; padding:0; font-size:16px; cursor:pointer; }
.workspace-delete:hover { color:#ffb3b3; background:#2a1515; border-color:#5a2a2a; }
.workspace-item strong { font-size:15px; font-weight:600; }
.workspace-item span { font-size:14px; color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sidebar-sep { height:1px; background:var(--border); margin:2px 0; }
#workspace-form { display:flex; flex-direction:column; gap:5px; }
#workspace-form[hidden] { display:none; }
#workspace-form input { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:5px; padding:5px 7px; font:inherit; font-size:12px; }
.workspace-form-actions { display:flex; gap:5px; }
.workspace-form-actions button, .history-tools button, #history-select-bar button { background:var(--bg); color:var(--text); border:1px solid var(--border); min-height:28px; min-width:0; padding:0 8px; font-size:12px; }
.history-tools { display:flex; gap:5px; }
.history-tools button { flex:1; }
#history-select-bar { display:flex; flex-wrap:wrap; gap:5px; }
#history-select-bar[hidden] { display:none; }
#delete-selected { border-color:#8a3a3a; color:#d66; }
@media (max-width:760px) {
  body.sidebar-open { padding-left:0; }
  #history-panel { width:min(350px,92vw); }
}
.history-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.history-head strong { font-size:16px; }
.history-head-actions { display:flex; gap:6px; }
.history-head-actions button { background:var(--bg); color:var(--text); border:1px solid var(--border); padding:0 9px; min-height:30px; min-width:0; font-size:12px; }
#history-close { font-size:17px; padding:0 9px; }
#history-search { width:100%; box-sizing:border-box; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:7px 9px; font:inherit; font-size:13px; }
#history-search::placeholder { color:var(--muted); opacity:1; }
#history-list { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:2px; }
.history-item { position:relative; border-bottom:1px solid var(--border); padding:7px 4px 7px 6px; border-radius:6px; }
.history-item:hover { background:var(--bg); }
.history-item.active { background:var(--bg); box-shadow:inset 3px 0 0 var(--accent); }
.history-title { display:block; width:100%; text-align:left; background:none; color:var(--text); border:0; padding:0; font:inherit; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.history-meta { color:var(--muted); font-size:12px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.history-check { float:left; margin:5px 7px 0 0; }
.history-actions { display:flex; gap:4px; margin-top:5px; }
.history-actions button { background:none; color:var(--muted); border:1px solid transparent; padding:0 5px; min-height:24px; min-width:0; font-size:13px; line-height:1; }
.history-actions button:hover { color:var(--text); border-color:var(--border); background:var(--panel); }
.history-actions button.on { color:var(--accent); }
.history-rename { width:100%; box-sizing:border-box; background:var(--bg); color:var(--text); border:1px solid var(--accent); border-radius:5px; padding:3px 6px; font:inherit; font-size:14px; }
.history-empty { color:var(--muted); padding:12px 4px; font-size:13px; }


#model-toggle { background:var(--panel); color:var(--text); border:1px solid var(--border); padding:0 10px; font-size:13px; }
#model-panel { position:fixed; top:58px; right:16px; width:min(410px,92vw); max-height:calc(100vh - 76px); z-index:1300; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; box-shadow:0 16px 45px rgba(0,0,0,.35); }
#model-panel[hidden] { display:none; }
#artifact-panel { position:fixed; top:58px; right:16px; width:min(460px,92vw); max-height:calc(100vh - 76px); z-index:1320; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; box-shadow:0 16px 45px rgba(0,0,0,.35); }
#artifact-panel[hidden] { display:none; }
.artifact-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.artifact-head strong { font-size:16px; }
#artifact-close { background:var(--bg); color:var(--text); border:1px solid var(--border); min-width:30px; min-height:28px; padding:0 8px; font-size:17px; }
#artifact-list { display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
.artifact-item { text-align:left; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:5px 7px; font-size:12px; cursor:pointer; word-break:break-all; }
.artifact-item.active { box-shadow:inset 3px 0 0 var(--accent); }
#artifact-viewer { display:flex; align-items:center; justify-content:center; background:var(--bg); border:1px solid var(--border); border-radius:7px; min-height:120px; overflow:auto; }
#artifact-image { max-width:100%; max-height:55vh; display:block; }
#artifact-code { margin:0; padding:8px; width:100%; max-height:55vh; overflow:auto; white-space:pre; font-size:12px; }
#artifact-meta { color:var(--muted); font-size:12px; margin-top:7px; word-break:break-all; }
.tool-artifacts { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.tool-artifact { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 7px; font-size:12px; cursor:pointer; max-width:100%; }
.tool-artifact img { display:block; max-width:120px; max-height:90px; border-radius:4px; }
.inline-artifacts { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
.inline-artifact { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px; cursor:pointer; }
.inline-artifact img { display:block; max-width:320px; max-height:240px; border-radius:5px; }
.inline-artifact span { display:block; color:var(--muted); font-size:12px; margin-top:4px; max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.model-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px; }
.model-head strong { font-size:16px; }
#model-close { background:var(--bg); color:var(--text); border:1px solid var(--border); min-width:30px; min-height:28px; padding:0 8px; font-size:17px; }
#model-status { color:var(--muted); font-size:13px; margin-bottom:8px; white-space:pre-wrap; }
.model-item { border:1px solid var(--border); border-radius:7px; padding:8px; margin-bottom:7px; background:var(--bg); }
.model-item.active { box-shadow:inset 3px 0 0 var(--ok); }
.model-name { color:var(--text); font-size:15px; font-weight:600; word-break:break-all; }
.model-meta { color:var(--muted); font-size:14px; margin:4px 0 7px; }
.model-badges { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:5px; }
.model-badge { font-size:12px; border:1px solid var(--border); border-radius:10px; padding:2px 7px; color:var(--muted); }
.model-badge.live { color:var(--ok); border-color:var(--ok); }
.model-tags { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin:3px 0 6px; }
.model-tag { font-size:12px; border:1px solid var(--accent); color:var(--accent); border-radius:10px; padding:2px 7px; }
.model-tag-edit { background:transparent; border:1px dashed var(--border); color:var(--muted); border-radius:10px; font-size:11px; padding:2px 7px; min-height:0; min-width:0; }
.model-actions { display:flex; gap:5px; }
.model-actions button { background:var(--accent); color:#08111f; border:0; border-radius:5px; min-height:26px; min-width:0; padding:0 10px; font-size:12px; }
.model-actions button:disabled { opacity:.5; }
.model-empty { color:var(--muted); font-size:13px; padding:8px 2px; }


.provider-section { border-bottom:1px solid var(--border); margin-bottom:10px; padding-bottom:10px; }
.provider-status { color:var(--muted); font-size:13px; margin:5px 0; white-space:pre-wrap; }
.provider-hint { color:var(--muted); font-size:12px; line-height:1.4; }
.provider-warning { color:#e0a030; font-size:13px; font-weight:600; margin-top:4px; }
#provider-select { flex:1; min-width:0; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:5px; padding:5px 7px; font-size:13px; }
#provider-restart { background:var(--accent); color:#08111f; border:0; border-radius:5px; padding:0 10px; min-height:28px; font-size:13px; }
.model-install { border-top:1px solid var(--border); margin-top:10px; padding-top:10px; }
.model-install-title { font-size:14px; font-weight:600; margin-bottom:7px; }
.model-row { display:flex; gap:5px; margin-bottom:6px; }
.model-row input { flex:1; min-width:0; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:5px; padding:5px 7px; font-size:13px; }
.model-row button, #model-cancel { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:5px; padding:0 8px; font-size:13px; min-height:28px; }
#model-cancel { margin-top:5px; }
#model-search-results, #model-files { display:flex; flex-direction:column; gap:4px; margin-bottom:6px; }
.catalog-item { display:flex; justify-content:space-between; align-items:center; gap:6px; border:1px solid var(--border); border-radius:5px; padding:5px 7px; background:var(--bg); font-size:12px; }
.catalog-item button { background:var(--accent); color:#08111f; border:0; border-radius:4px; min-height:26px; padding:0 8px; font-size:12px; }
.catalog-name { color:var(--text); font-size:13px; word-break:break-all; }
.catalog-meta { color:var(--muted); font-size:13px; }
#model-download { margin-top:6px; }
#model-download-text { color:var(--muted); font-size:13px; margin-bottom:4px; white-space:pre-wrap; }
#model-progress { width:100%; height:8px; accent-color:var(--accent); }
#model-install-status { color:var(--muted); font-size:13px; margin-top:6px; white-space:pre-wrap; }


#mcp-toggle, #automation-toggle { background:var(--panel); color:var(--text); border:1px solid var(--border); padding:0 10px; font-size:13px; }
#automation-panel { position:fixed; top:58px; right:16px; width:min(460px,92vw); max-height:calc(100vh - 76px); z-index:1330; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; box-shadow:0 16px 45px rgba(0,0,0,.35); }
#automation-panel[hidden] { display:none; }
.automation-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.automation-head strong { font-size:16px; }
#automation-close { background:var(--bg); color:var(--text); border:1px solid var(--border); min-width:30px; min-height:28px; padding:0 8px; font-size:17px; }
#automation-new { background:var(--accent); color:#08111f; border:0; border-radius:5px; min-height:28px; padding:0 9px; font-size:12px; }
.automation-tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:7px; }
.automation-tabs button { background:var(--bg); color:var(--muted); border:1px solid var(--border); border-radius:12px; min-height:24px; padding:0 8px; font-size:12px; }
.automation-tabs button.active { color:var(--accent); border-color:var(--accent); }
#automation-search { width:100%; box-sizing:border-box; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:5px; padding:6px 8px; font-size:13px; margin-bottom:8px; }
.automation-card { border:1px solid var(--border); border-radius:7px; padding:8px; margin-bottom:6px; background:var(--bg); }
.automation-title { color:var(--text); font-size:14px; font-weight:600; }
.automation-meta { color:var(--muted); font-size:12px; margin-top:3px; }
.automation-result { color:var(--muted); font-size:12px; margin-top:5px; max-height:70px; overflow:auto; white-space:pre-wrap; }
.automation-actions { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
.automation-actions button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:5px; min-height:24px; padding:0 7px; font-size:11px; }
.automation-actions button[data-action="delete"] { color:#e0a030; }
.automation-empty { color:var(--muted); font-size:13px; padding:8px 2px; }
.automation-review { border-top:1px solid var(--border); margin-top:10px; padding-top:8px; }
.automation-review-title { font-size:13px; font-weight:600; margin-bottom:5px; }
.automation-review-row { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; padding:3px 0; }
#automation-form { border-top:1px solid var(--border); margin-top:8px; padding-top:8px; display:flex; flex-direction:column; gap:6px; }
#automation-form[hidden] { display:none; }
#automation-form input, #automation-form select, #automation-form textarea { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:5px; padding:6px 7px; font-size:13px; }
#automation-form textarea { min-height:70px; resize:vertical; }
#automation-form-actions { display:flex; gap:5px; }
#automation-form-actions button { min-height:28px; font-size:12px; }
#mcp-panel { position:fixed; top:58px; right:16px; width:min(420px,92vw); max-height:calc(100vh - 76px); z-index:1300; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; box-shadow:0 16px 45px rgba(0,0,0,.35); }
#mcp-panel[hidden] { display:none; }
.mcp-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px; }
.mcp-head strong { font-size:16px; }
#mcp-close { background:var(--bg); color:var(--text); border:1px solid var(--border); min-width:30px; min-height:28px; padding:0 8px; font-size:17px; }

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.className = isError ? 'error' : '';
}

function add(className, text = '') {
  const element = document.createElement('div');
  element.className = className;
  element.textContent = text;
  log.appendChild(element);
  log.scrollTop = log.scrollHeight;
  return element;
}

function formatSessionTime(ms) {
  if (!ms) return '';
  try {
    return new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (error) {
    return '';
  }
}

async function refreshSessions() {
  if (!token) return;
  try {
    const response = await fetch('/api/sessions?token=' + encodeURIComponent(token));
    if (!response.ok) {
      add('error', await response.text());
      return;
    }
    const data = await response.json();
    sessionList = data.sessions || [];
    renderHistory();
  } catch (error) {
    add('error', String(error));
  }
}

function visibleSessions() {
  const query = (historySearch.value || '').trim().toLowerCase();
  return sessionList.filter((session) => {
    if ((session.workspace || 'home') !== currentWorkspaceId) return false;
    if (!query) return true;
    return (session.title || '').toLowerCase().includes(query)
      || (session.model || '').toLowerCase().includes(query)
      || (session.id || '').toLowerCase().includes(query);
  });
}

function addUserMessage(text) {
  return add('user', text);
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

window.__harnessFileSaved = (name) => {
  setStatus('saved ' + name);
  add('meta', 'saved ' + name);
};

window.__harnessFileCanceled = () => {
  setStatus('ready');
  add('meta', 'save cancelled');
};

async function saveTextFile(filename, text) {
  setStatus('choose save location');
  const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.savefile;
  if (bridge) {
    bridge.postMessage(JSON.stringify({ filename, text }));
    return;
  }
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'Text transcript', accept: { 'text/plain': ['.txt'] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      window.__harnessFileSaved(handle.name);
      return;
    } catch (error) {
      if (error && error.name === 'AbortError') {
        window.__harnessFileCanceled();
        return;
      }
    }
  }
  downloadText(filename, text);
  setStatus('ready');
}

async function exportSession(id) {
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id) + '/export?token=' + encodeURIComponent(token));
    if (!response.ok) {
      add('error', await response.text());
      return;
    }
    await saveTextFile('local-harness-' + id + '.txt', await response.text());
  } catch (error) {
    add('error', String(error));
  }
}

async function exportAll() {
  try {
    const base = '/api/sessions/export?token=' + encodeURIComponent(token);
    const url = selectMode && selectedSessions.size
      ? base + '&ids=' + encodeURIComponent(Array.from(selectedSessions).join(','))
      : base + '&workspace=' + encodeURIComponent(currentWorkspaceId);
    const response = await fetch(url);
    if (!response.ok) {
      add('error', await response.text());
      return;
    }
    await saveTextFile(selectMode && selectedSessions.size ? 'local-harness-selected.txt' : 'local-harness-chats.txt', await response.text());
  } catch (error) {
    add('error', String(error));
  }
}

function humanSize(bytes) {
  const value = Number(bytes) || 0;
  if (value >= 1024 ** 3) return (value / 1024 ** 3).toFixed(2) + ' GB';
  if (value >= 1024 ** 2) return (value / 1024 ** 2).toFixed(1) + ' MB';
  return value + ' B';
}

async function refreshMcp() {
  if (!token) return;
  mcpSummary.textContent = 'Loading MCP status…';
  mcpServerList.innerHTML = '';
  try {
    const response = await fetch('/api/mcp/status?token=' + encodeURIComponent(token));

function renderMcp(data) {
  const servers = data.servers || [];
  const failures = data.failures || [];
  const toolCount = Number(data.tool_count) || 0;
  mcpSummary.textContent = servers.length + ' connected · ' + toolCount + ' tool' + (toolCount === 1 ? '' : 's') + (failures.length ? ' · ' + failures.length + ' failed' : '');

  for (const failure of failures) {
    const card = document.createElement('div');
    card.className = 'mcp-failure';
    const name = document.createElement('strong');
    name.textContent = failure.name + ' — unavailable';
    const error = document.createElement('div');
    error.textContent = failure.error;
    card.append(name, error);
    mcpServerList.appendChild(card);
  }
  if (!servers.length && !failures.length) {
    const empty = document.createElement('div');
    empty.className = 'mcp-empty';
    empty.textContent = 'No MCP servers configured. Add ~/.harness/mcp.json and restart Local Harness after starting the server.';
    mcpServerList.appendChild(empty);
    return;
  }
  for (const server of servers) {
    const card = document.createElement('div');
    card.className = 'mcp-server';
    const head = document.createElement('div');
    head.className = 'mcp-server-head';
    const name = document.createElement('div');
    name.className = 'mcp-server-name';
    name.textContent = server.name;
    const badge = document.createElement('span');
    badge.className = 'mcp-badge';
    badge.textContent = server.transport || 'mcp';
    head.append(name, badge);
    const meta = document.createElement('div');
    meta.className = 'mcp-meta';
    meta.textContent = (server.tools || []).length + ' tools';
    card.append(head, meta);
    const tools = document.createElement('div');
    for (const tool of server.tools || []) {
      const item = document.createElement('div');
      item.className = 'mcp-tool';
      const toolName = document.createElement('div');
      toolName.className = 'mcp-tool-name';
      toolName.textContent = tool.call_name;
      const description = document.createElement('div');
      description.className = 'mcp-tool-desc';
      description.textContent = tool.description || '';

function startModelDownloadPolling() {
  if (!modelDownloadTimer) modelDownloadTimer = setInterval(refreshModelDownload, 1000);
  refreshModelDownload();
}

function renderModelDownload(data) {
  if (!data || data.state === 'idle') {
    modelDownload.hidden = true;
    return;
  }
  const state = data.state || '';
  const total = Number(data.total) || 0;
  const downloaded = Number(data.downloaded) || 0;
  const percent = total > 0 ? Math.min(100, Math.round((downloaded / total) * 100)) : 0;
  modelDownload.hidden = false;
  modelCancel.hidden = state !== 'downloading';
  if (state === 'downloading') {
    modelDownloadText.textContent = 'Downloading ' + data.file + '\n' + humanSize(downloaded) + ' / ' + humanSize(total) + ' (' + percent + '%)';
    modelProgress.value = percent;
    modelInstallStatus.textContent = '';
  } else if (state === 'complete') {
    modelDownloadText.textContent = 'Installed ' + data.file + ' (' + humanSize(total) + ').';
    modelProgress.value = 100;
    modelInstallStatus.textContent = 'Installed. Use Switch to this model above.';
  } else if (state === 'cancelled') {
    modelDownloadText.textContent = 'Download cancelled.';
    modelProgress.value = 0;
  } else if (state === 'error') {
    modelDownloadText.textContent = 'Download failed: ' + (data.error || 'unknown error');
    modelProgress.value = 0;
    modelInstallStatus.textContent = data.error || '';
  }
}

async function refreshModelDownload() {
  try {
    const response = await fetch('/api/model-catalog/status?token=' + encodeURIComponent(token));
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      modelInstallStatus.textContent = data.error || ('HTTP ' + response.status);
      return;
    }
    renderModelDownload(data);
    if (data.state !== 'downloading') {
      stopModelDownloadTimer();
      if (data.state === 'complete') await refreshLocalModels();
    }
  } catch (error) {
    modelInstallStatus.textContent = String(error);
    stopModelDownloadTimer();
  }
}

async function cancelModelDownload() {

    stopModelDownloadTimer();
  } catch (error) {
    modelInstallStatus.textContent = String(error);
  }
}

async function refreshProviders() {
  if (!token) return;

    const response = await fetch('/api/providers?token=' + encodeURIComponent(token));
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      providerStatus.textContent = data.error || ('HTTP ' + response.status);
      return;
    }
    providerState = data;
    providerSelect.innerHTML = '';
    const labels = {};
    for (const provider of data.providers || []) {
      labels[provider.id] = provider.label;
      const option = document.createElement('option');
      option.value = provider.id;
      const key = provider.id === 'local' ? 'local' : (provider.key_present ? 'key ready' : 'key missing');
      option.textContent = provider.label + ' · ' + key;
      providerSelect.appendChild(option);
    }
    providerSelect.value = data.active || 'local';
    const activeLabel = labels[data.current_provider] || data.current_provider || 'unknown';
    const savedLabel = labels[data.active] || data.active || 'unknown';
    const activeModel = data.current_remote
      ? data.current_model + ' (' + activeLabel + ')'
      : (data.current_model || 'local llama.cpp') + ' (Local llama.cpp)';
    let text = 'ACTIVE FOR NEW CHATS\n' + activeModel + '\n\nSAVED CHOICE\n' + savedLabel;

    if (data.restart_required) {
      text += '\n\nRestart Local Harness to apply the saved choice.';

    }

    providerRestart.hidden = !data.restart_required;
    providerHint.textContent = 'Keys: DEEPSEEK_API_KEY / MOONSHOT_API_KEY, or ' + (data.secrets_path || 'secrets.env') + ' with chmod 600.';

async function selectProvider() {
  const label = providerSelect.options[providerSelect.selectedIndex]?.textContent || providerSelect.value;
  if (!confirm('Save provider "' + label + '"?\n\nLocal Harness must be restarted to apply it.')) {
    await refreshProviders();

  }
  providerSelect.disabled = true;
  try {
    const response = await fetch('/api/providers/select?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: providerSelect.value }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      providerStatus.textContent = data.error || ('HTTP ' + response.status);
      return;
    }
    providerStatus.textContent = data.message || 'Provider saved. Restart to apply.';
    add('meta', 'provider saved: ' + label + ' · restart Local Harness to apply');
  } catch (error) {
    providerStatus.textContent = String(error);
  } finally {
    providerSelect.disabled = false;

async function restartHarness() {
  if (!confirm('Restart Local Harness now?\n\nThe window will reconnect automatically.')) return;
  providerRestart.disabled = true;
  providerStatus.textContent = 'Restarting Local Harness…';
  try {
    const response = await fetch('/api/providers/restart?token=' + encodeURIComponent(token), { method: 'POST' });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      providerStatus.textContent = data.error || ('HTTP ' + response.status);
      providerRestart.disabled = false;
      return;
    }
    providerStatus.textContent = data.message || 'Restarting…';
    for (let i = 0; i < 45; i++) {
      await new Promise((resolve) => setTimeout(resolve, 1000));
      try {
        const health = await fetch('/api/health?token=' + encodeURIComponent(token), { cache: 'no-store' });
        if (health.ok) {
          window.location.reload();
          return;
        }
      } catch (error) {
        // service is still restarting
      }
    }
    providerStatus.textContent = 'Restart requested. Close and reopen the window if this page does not return.';
  } catch (error) {
    providerStatus.textContent = String(error);
  } finally {
    providerRestart.disabled = false;
  }
}

function renderLocalModels(data) {
  const selected = data.selected || {};
  const remote = Boolean(providerState && providerState.current_remote);
  const active = remote ? '' : (data.active || '');
  const healthy = data.healthy ? 'healthy' : 'not healthy';
  const providerLabel = providerState
    ? ((providerState.providers || []).find((provider) => provider.id === providerState.current_provider) || {}).label
    : '';
  modelStatus.textContent = remote
    ? 'Chats use ' + data.chat_model + ' via ' + (providerLabel || 'remote API') + '.\nLocal llama-server is ' + healthy + '; these models are NOT active for chats.'
    : 'Chats use Local llama.cpp · ' + (active || 'no active model') + ' · ' + healthy;
  modelList.innerHTML = '';
  const models = data.models || [];
  if (!models.length) {
    const empty = document.createElement('div');
    empty.className = 'model-empty';
    empty.textContent = 'No non-vocabulary GGUF models found.';
    modelList.appendChild(empty);
    return;
  }
  for (const model of models) {
    const item = document.createElement('div');
    item.className = 'model-item' + (model.alias === active ? ' active' : '');
    const name = document.createElement('div');
    name.className = 'model-name';
    name.textContent = model.name || model.alias;
    const meta = document.createElement('div');
    meta.className = 'model-meta';
    meta.textContent = humanSize(model.size) + ' · ' + (model.path || '');
    const badges = document.createElement('div');
    badges.className = 'model-badges';
    if (model.alias === active) {
      const live = document.createElement('span');
      live.className = 'model-badge live';
      live.textContent = 'active';
      badges.appendChild(live);
    }
    if (model.path === selected.path) {
      const badge = document.createElement('span');
      badge.className = 'model-badge';
      badge.textContent = 'selected';
      badges.appendChild(badge);
    }
    const tags = document.createElement('div');
    tags.className = 'model-tags';
    for (const tag of model.tags || []) {
      const tagEl = document.createElement('span');
      tagEl.className = 'model-tag';
      tagEl.textContent = tag;
      tags.appendChild(tagEl);
    }
    const tagEdit = document.createElement('button');
    tagEdit.type = 'button';
    tagEdit.className = 'model-tag-edit';
    tagEdit.textContent = (model.tags || []).length ? 'edit tags' : '+ tag';
    tagEdit.title = 'Add, rename, or remove purpose tags';
    tagEdit.addEventListener('click', () => editModelTags(model));
    tags.appendChild(tagEdit);
    const actions = document.createElement('div');
    actions.className = 'model-actions';
    const use = document.createElement('button');
    use.type = 'button';
    if (remote) {
      use.textContent = 'Not active (remote provider)';
      use.disabled = true;
      use.title = 'Select Local provider and restart to use local models.';
    } else {
      use.textContent = model.path === selected.path ? 'Selected' : 'Switch to this model';
      use.disabled = model.path === selected.path;
      use.addEventListener('click', () => switchModel(model));
    }
    actions.appendChild(use);
    item.append(name, meta, badges, tags, actions);
    modelList.appendChild(item);
  }
}

async function editModelTags(model) {
  const current = (model.tags || []).join(', ');
  const raw = prompt(
    'Purpose tags for ' + (model.name || model.alias) + '\nComma-separated, e.g. PhotoCraft, Coding:',
    current
  );
  if (raw === null) return;
  const tags = raw.split(',').map((tag) => tag.trim()).filter(Boolean);
  try {
    const response = await fetch('/api/local-models/tags?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: model.path, tags }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      modelStatus.textContent = data.error || ('HTTP ' + response.status);
      return;
    }
    await refreshLocalModels();
  } catch (error) {
    modelStatus.textContent = String(error);
  }
}

async function switchModel(model) {
  if (controller) {
    add('meta', 'stop the running chat before switching models');
    return;
  }
  if (!confirm('Switch llama-server to "' + (model.name || model.alias) + '"?\n\nThe model server will restart and be unavailable while loading.')) return;
  modelStatus.textContent = 'Switching to ' + (model.name || model.alias) + '… this can take up to two minutes.';
  setStatus('switching model');
  modelList.querySelectorAll('button').forEach((button) => { button.disabled = true; });
  try {
    const response = await fetch('/api/local-models/select?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: model.path }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      modelStatus.textContent = data.error || ('HTTP ' + response.status);
      add('error', data.error || ('HTTP ' + response.status));
      setStatus('error', true);
      return;
    }
    add('meta', 'model switched to ' + (data.selected && data.selected.name ? data.selected.name : model.name));
    setStatus('ready');
    await refreshLocalModels();
  } catch (error) {
    modelStatus.textContent = String(error);
    add('error', String(error));
    setStatus('error', true);
  }
}

function currentWorkspace() {

function showLanding() {
  if (currentSessionId || currentWorkspaceId) return;
  log.innerHTML = '';
  add('meta', 'Select a workspace to start a new chat. Previous chats appear after choosing a workspace.');
  promptEl.placeholder = 'Select a workspace to start…';

function restoreComposer() {
  promptEl.placeholder = 'Ask the local model… (Enter to send, Shift+Enter for a newline)';

function renderWorkspaces() {
  workspaceList.innerHTML = '';
  for (const workspace of workspaceItems) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'workspace-item' + (workspace.id === currentWorkspaceId ? ' active' : '');

    name.textContent = workspace.name || workspace.id;

    item.addEventListener('click', () => selectWorkspace(workspace.id));
    const row = document.createElement('div');
    row.className = 'workspace-row';
    row.appendChild(item);
    if (!workspace.builtin) {
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'workspace-delete';
      remove.textContent = '×';
      remove.title = 'Delete workspace';
      remove.addEventListener('click', (event) => {
        event.stopPropagation();
        deleteWorkspace(workspace.id, workspace.name || workspace.id);

    workspaceList.appendChild(row);

}

function selectWorkspace(id) {

    add('meta', 'stop the running response before switching workspaces');
    return;
  }
  currentWorkspaceId = id;
  currentSessionId = null;
  log.innerHTML = '';
  const workspace = currentWorkspace();
  add('meta', 'workspace · ' + workspace.name + (workspace.path ? ' · ' + workspace.path : ''));

async function createWorkspace() {

  try {
    const response = await fetch('/api/workspaces?token=' + encodeURIComponent(token), {
      method: 'POST',

      body: JSON.stringify({ name, path: workspacePath.value.trim() }),
    });
    if (!response.ok) {
      add('error', await response.text());
      return;
    }
    const data = await response.json();
    workspaceForm.hidden = true;

function renderHistory() {
  if (!historyList) return;
  const filtered = visibleSessions();
  historyList.innerHTML = '';
  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = sessionList.length ? 'No chats in this workspace' : 'No saved chats yet';
    historyList.appendChild(empty);
    return;
  }
  for (const session of filtered) {
    const item = document.createElement('div');
    item.className = 'history-item' + (session.id === currentSessionId ? ' active' : '');

    let check = null;
    if (selectMode) {
      check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'history-check';
      check.checked = selectedSessions.has(session.id);
      check.addEventListener('change', () => {
        if (check.checked) selectedSessions.add(session.id);
        else selectedSessions.delete(session.id);
      });
      item.appendChild(check);
    }

    const title = document.createElement('button');
    title.type = 'button';
    title.className = 'history-title';
    title.textContent = session.title || 'New chat';
    title.title = session.title || 'New chat';
    title.addEventListener('click', () => {
      if (selectMode && check) {
        check.checked = !check.checked;
        check.dispatchEvent(new Event('change'));
      } else {
        loadSession(session.id);
      }
    });

    const meta = document.createElement('div');
    meta.className = 'history-meta';
    const when = formatSessionTime(session.updated_at);
    const model = session.model ? ' · ' + session.model : '';
    meta.textContent = [when, session.message_count + ' msgs', model.trim()].filter(Boolean).join(' · ');

    const actions = document.createElement('div');
    actions.className = 'history-actions';

    const pin = document.createElement('button');
    pin.type = 'button';
    pin.className = session.pinned ? 'on' : '';
    pin.title = session.pinned ? 'Unpin chat' : 'Pin chat';
    pin.textContent = session.pinned ? '📌' : '📍';
    pin.addEventListener('click', () => patchSession(session.id, { pinned: !session.pinned }));

    const rename = document.createElement('button');
    rename.type = 'button';
    rename.title = 'Rename chat';
    rename.textContent = '✎';
    rename.addEventListener('click', () => startRename(item, session));

    const exportButton = document.createElement('button');
    exportButton.type = 'button';
    exportButton.title = 'Export chat as text';
    exportButton.textContent = '⤓';
    exportButton.addEventListener('click', () => exportSession(session.id));

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.title = 'Delete chat';
    remove.textContent = '🗑';
    remove.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      deleteSession(session.id);
    });

    actions.append(pin, rename, exportButton, remove);
    item.append(title, meta, actions);
    historyList.appendChild(item);
  }
}

async function patchSession(id, patch) {
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id) + '?token=' + encodeURIComponent(token), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch),
    });
    if (!response.ok) {
      add('error', await response.text());
      return false;
    }
    await refreshSessions();
    return true;
  } catch (error) {
    add('error', String(error));
    return false;
  }
}

async function deleteSession(id) {
  if (!confirm('Delete this chat? It will be moved to the session trash.')) return;
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id) + '?token=' + encodeURIComponent(token), { method: 'DELETE' });
    if (response.status === 409) {
      add('error', 'That chat is still running. Stop it before deleting.');
      return;
    }
    if (!response.ok) {
      add('error', await response.text());
      return;
    }
    if (currentSessionId === id) {
      if (controller) {
        controller.abort();
        controller = null;
      }
      currentSessionId = null;
      assistantEl = null;
      openTool = null;
      finished = true;
      log.innerHTML = '';
      add('meta', 'new chat');
      if (currentWorkspaceId) {
        restoreComposer();
      } else {
        showLanding();
      }
      sendEl.disabled = false;
      stopEl.disabled = true;
      setStatus('ready');
    }
    await refreshSessions();
  } catch (error) {
    add('error', String(error));
  }
}

async function deleteSelected() {
  if (!selectedSessions.size) return;
  if (!confirm('Delete ' + selectedSessions.size + ' selected chat(s)? They will be moved to the session trash.')) return;
  const ids = Array.from(selectedSessions);
  const failed = [];
  for (const id of ids) {
    try {
      const response = await fetch('/api/sessions/' + encodeURIComponent(id) + '?token=' + encodeURIComponent(token), { method: 'DELETE' });
      if (!response.ok) failed.push(id);
    } catch (error) {
      failed.push(id);
    }
  }
  if (ids.includes(currentSessionId)) {
    if (controller) {
      controller.abort();
      controller = null;
    }
    currentSessionId = null;
    assistantEl = null;
    openTool = null;
    finished = true;
    log.innerHTML = '';
    add('meta', 'new chat');
    if (currentWorkspaceId) restoreComposer();
    else showLanding();
    sendEl.disabled = false;
    stopEl.disabled = true;
    setStatus('ready');
  }
  selectedSessions.clear();
  selectMode = false;
  selectToggle.textContent = 'Select';
  historySelectBar.hidden = true;
  if (failed.length) add('error', failed.length + ' chat(s) could not be deleted (running or missing).');

}

function startRename(item, session) {
  const title = item.querySelector('.history-title');
  if (!title) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'history-rename';
  input.value = session.title || '';
  title.replaceWith(input);
  input.focus();
  input.select();
  let finished = false;
  const finish = async (save) => {
    if (finished) return;
    finished = true;
    if (!save) {
      renderHistory();
      return;
    }
    await patchSession(session.id, { title: input.value });
  };
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      finish(true);
    } else if (event.key === 'Escape') {
      event.preventDefault();
      finish(false);
    }
  });
  input.addEventListener('blur', () => finish(true));
}

function appendHistoryMessage(message) {
  if (!message || !message.role) return;
  if (message.role === 'user' && message.content) {
    addUserMessage(message.content);
  } else if (message.role === 'assistant') {
    if (message.content) {
      const element = add('assistant');
      element.dataset.raw = message.content;
      element.innerHTML = renderMarkdown(message.content);
      enhanceAssistant(element);
      renderInlineArtifacts(element, message.content);
    }
    if (Array.isArray(message.tool_calls)) {
      for (const call of message.tool_calls) {
        add('meta', 'tool call · ' + (call.function && call.function.name ? call.function.name : 'unknown'));
      }
    }
  } else if (message.role === 'tool' && message.content) {
    const details = document.createElement('details');
    details.className = 'tool-card';
    details.innerHTML = '<summary>tool result <span class="tool-status ok">history</span></summary><div class="tool-block"><pre><code></code></pre></div>';
    details.querySelector('code').textContent = message.content;
    log.appendChild(details);
  }
  log.scrollTop = log.scrollHeight;
}

function applyTheme(name) {
  if (!themes[name]) name = 'xterm';
  const theme = themes[name];
  const root = document.documentElement;
  root.style.setProperty('--bg', theme.bg);
  root.style.setProperty('--panel', theme.panel);
  root.style.setProperty('--text', theme.text);
  root.style.setProperty('--muted', theme.muted);
  root.style.setProperty('--border', theme.border);
  root.style.setProperty('--accent', theme.accent);
  root.style.setProperty('--ok', theme.ok || '#68d391');
  root.style.colorScheme = theme.scheme;
  const code = theme.code || darkCode;
  for (const [key, value] of Object.entries(code)) {
    root.style.setProperty('--code-' + key, value);
  }
  themeEl.value = name;
  localStorage.setItem('localHarnessTheme', name);
}

async function loadSpellDictionary() {
  try {
    const [aff, dic] = await Promise.all([
      fetch('/assets/en_AU.aff').then((response) => { if (!response.ok) throw new Error('aff ' + response.status); return response.text(); }),
      fetch('/assets/en_AU.dic').then((response) => { if (!response.ok) throw new Error('dic ' + response.status); return response.text(); })
    ]);
    spellDictionary = new Typo('en_AU', aff, dic, { platform: 'any' });
    if (spellcheckEnabled) renderSpellLayer();
  } catch (error) {
    console.error('spellcheck dictionary failed', error);
  }
}

function skipSpellWord(word) {
  return word.length <= 2 || spellIgnore.has(word.toLowerCase());
}

function renderSpellLayer() {
  if (!spellcheckEnabled || !spellDictionary) {
    spellLayer.innerHTML = '';
    return;
  }
  const text = promptEl.value;
  const pattern = /[A-Za-z][A-Za-z'’-]*/g;
  let html = '';
  let last = 0;
  let match;
  while ((match = pattern.exec(text)) !== null) {
    const word = match[0];
    if (skipSpellWord(word) || spellDictionary.check(word)) continue;
    html += escapeHtml(text.slice(last, match.index));
    html += '<mark data-start="' + match.index + '" data-end="' + (match.index + word.length) + '">' + escapeHtml(word) + '</mark>';
    last = match.index + word.length;
  }
  html += escapeHtml(text.slice(last));
  spellLayer.innerHTML = html + (text.endsWith('\n') ? ' ' : '');
  spellLayer.scrollTop = promptEl.scrollTop;
}

function scheduleSpell() {
  if (!spellcheckEnabled) {

async function writeClipboard(text) {
  if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (error) {}
  }
  try {
    const scratch = document.createElement('textarea');
    scratch.value = text;
    document.body.appendChild(scratch);
    scratch.select();
    const ok = document.execCommand('copy');
    scratch.remove();
    return ok;
  } catch (error) {
    return false;
  }
}

let clipboardBridgeResolve = null;

window.__harnessClipboardText = (text) => {
  const resolve = clipboardBridgeResolve;
  clipboardBridgeResolve = null;
  if (resolve) resolve(text);
};

function clipboardBridge() {
  return window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clipboard;
}

async function readClipboardText() {
  const bridge = clipboardBridge();
  if (bridge) {
    const bridged = await new Promise((resolve) => {
      clipboardBridgeResolve = resolve;
      bridge.postMessage('read');
      setTimeout(() => {
        if (clipboardBridgeResolve === resolve) {
          clipboardBridgeResolve = null;
          resolve(null);
        }
      }, 2500);
    });
    if (bridged !== null) return bridged;
  }
  if (navigator.clipboard && navigator.clipboard.readText) {
    try { return await navigator.clipboard.readText(); } catch (error) {}
  }
  if (navigator.clipboard && navigator.clipboard.read) {
    try {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        if (item.types.includes('text/plain')) {
          const blob = await item.getType('text/plain');
          return await blob.text();
        }
      }
    } catch (error) {}
  }
  return null;
}

function firstMisspelling() {
  const text = promptEl.value;
  const pattern = /[A-Za-z][A-Za-z'’-]*/g;
  let match;
  while ((match = pattern.exec(text)) !== null) {
    if (!skipSpellWord(match[0]) && !spellDictionary.check(match[0])) {
      return { word: match[0], start: match.index, end: match.index + match[0].length };
    }
  }
  return null;
}

function spellingAt(x, y, allowFallback) {
  if (!spellcheckEnabled || !spellDictionary) return null;
  renderSpellLayer();
  const marks = Array.from(spellLayer.querySelectorAll('mark'));
  let mark = marks.find((candidate) => {
    const rect = candidate.getBoundingClientRect();
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  });
  if (!mark && allowFallback && marks.length) {
    mark = marks.map((candidate) => {
      const rect = candidate.getBoundingClientRect();
      const dx = Math.max(rect.left - x, 0, x - rect.right);
      const dy = Math.max(rect.top - y, 0, y - rect.bottom);
      return { candidate, distance: dx * dx + dy * dy };
    }).sort((a, b) => a.distance - b.distance)[0].candidate;
  }
  if (mark) {
    return { word: mark.textContent, start: Number(mark.dataset.start), end: Number(mark.dataset.end) };
  }
  return allowFallback ? firstMisspelling() : null;
}

const ARTIFACT_IMAGE_EXT = new Set(['png','jpg','jpeg','webp','gif','svg']);
const ARTIFACT_CODE_EXT = new Set(['py','sh','js','mjs','ts','tsx','jsx','json','md','html','htm','css','rs','toml','yaml','yml','xml','txt','log']);
let artifacts = [];
let activeArtifactPath = null;

function artifactKind(path) {
  const extension = (path.split('.').pop() || '').toLowerCase();
  if (ARTIFACT_IMAGE_EXT.has(extension)) return 'image';
  if (ARTIFACT_CODE_EXT.has(extension)) return 'code';
  return null;
}

function extractArtifacts(text) {
  const pattern = /(?:^|[\s("'`])((?:\.{1,2}\/|\/)?[^\s"'`<>]+\.(?:png|jpe?g|webp|gif|svg|py|sh|js|mjs|ts|tsx|jsx|json|md|html?|css|rs|toml|ya?ml|xml|txt|log))(?=$|[\s)"'`,.;:])/gi;
  const found = [];
  let match;
  while ((match = pattern.exec(text)) !== null) {
    let path = match[1].replace(/^["'`(]+|["'`),.;:]+$/g, '');
    if (/^https?:\/\//i.test(path)) continue;
    if (!artifactKind(path)) continue;
    if (!found.includes(path)) found.push(path);
    if (found.length >= 12) break;
  }
  return found;
}

function artifactUrl(path) {
  return '/api/artifact?token=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(path);
}

function artifactName(path) {
  return path.split('/').pop() || path;
}

function renderArtifactList() {
  artifactList.innerHTML = '';
  for (const path of artifacts) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'artifact-item' + (path === activeArtifactPath ? ' active' : '');
    button.textContent = (artifactKind(path) === 'image' ? 'Image · ' : 'Code · ') + artifactName(path);
    button.title = path;
    button.addEventListener('click', () => openArtifact(path));
    artifactList.appendChild(button);
  }
}

async function openArtifact(path) {
  const kind = artifactKind(path);
  if (!kind) return;
  activeArtifactPath = path;
  artifactPanel.hidden = false;
  if (!artifacts.includes(path)) artifacts.push(path);
  renderArtifactList();
  artifactImage.hidden = true;
  artifactCode.hidden = true;
  artifactMeta.textContent = path;
  if (kind === 'image') {
    artifactImage.src = artifactUrl(path);
    artifactImage.hidden = false;
    return;
  }
  try {
    const response = await fetch(artifactUrl(path));
    const text = await response.text();
    artifactCode.querySelector('code').textContent = response.ok ? text : (text || ('HTTP ' + response.status));
  } catch (error) {
    artifactCode.querySelector('code').textContent = String(error);
  }
  artifactCode.hidden = false;
}

function registerArtifacts(card, text) {
  const found = extractArtifacts(text);
  if (!found.length) return;
  for (const path of found) {
    if (!artifacts.includes(path)) artifacts.push(path);
  }
  renderArtifactList();
  const row = document.createElement('div');
  row.className = 'tool-artifacts';
  for (const path of found) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'tool-artifact';
    button.title = path;
    if (artifactKind(path) === 'image') {
      const image = document.createElement('img');
      image.src = artifactUrl(path);
      image.alt = artifactName(path);
      image.loading = 'lazy';
      button.appendChild(image);
    } else {
      button.textContent = 'Open ' + artifactName(path);
    }
    button.addEventListener('click', () => openArtifact(path));
    row.appendChild(button);
  }
  card.appendChild(row);
}

function renderInlineArtifacts(element, rawText) {
  if (!element || element.dataset.artifactsRendered === '1') return;
  const text = rawText || element.dataset.raw || element.textContent || '';
  const found = extractArtifacts(text);
  if (!found.length) return;
  element.dataset.artifactsRendered = '1';
  for (const path of found) {
    if (!artifacts.includes(path)) artifacts.push(path);
  }
  renderArtifactList();
  const row = document.createElement('div');
  row.className = 'inline-artifacts';
  for (const path of found) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'inline-artifact';
    item.title = path;
    if (artifactKind(path) === 'image') {
      const image = document.createElement('img');
      image.src = artifactUrl(path);
      image.alt = artifactName(path);
      image.loading = 'lazy';
      item.appendChild(image);
    }
    const label = document.createElement('span');
    label.textContent = artifactKind(path) === 'image' ? artifactName(path) : 'Open ' + artifactName(path);
    item.appendChild(label);
    item.addEventListener('click', () => openArtifact(path));
    row.appendChild(item);
  }
  element.appendChild(row);
}

        button.type = 'button';
        button.textContent = label;
        button.dataset.action = action;
        button.addEventListener('click', () => automationAction(task.id, action));
        actions.appendChild(button);
      };
      if (task.paused) addAction('Resume', 'resume');
      else if (!task.ended) addAction('Pause', 'pause');
      if (!task.ended) addAction('End', 'end');
      addAction('Run now', 'run');
      addAction('Delete', 'delete');
      card.appendChild(actions);
      automationList.appendChild(card);
    }
  }
  const active = automationTasks.filter((task) => !task.paused && !task.ended);
  automationDaily.textContent = String(active.filter((task) => task.frequency === 'daily').length);
  automationWeekly.textContent = String(active.filter((task) => task.frequency === 'weekly').length);
}

async function refreshAutomations() {
  if (!token) return;
  try {
    const response = await fetch('/api/automations?token=' + encodeURIComponent(token));
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      automationList.textContent = data.error || ('HTTP ' + response.status);
      return;
    }
    automationTasks = data.tasks || [];
    renderAutomations();
  } catch (error) {
    automationList.textContent = String(error);
  }
}

async function createAutomation(event) {
  event.preventDefault();
  const payload = {
    title: automationTitle.value.trim(),
    prompt: automationPrompt.value.trim(),
    frequency: automationFrequency.value,
    time: automationTime.value,
    weekday: automationFrequency.value === 'weekly' ? Number(automationWeekday.value) : null,
  };
  if (!payload.title || !payload.prompt) return;
  try {
    const response = await fetch('/api/automations?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      add('error', data.error || ('HTTP ' + response.status));
      return;
    }
    automationForm.hidden = true;
    automationTitle.value = '';
    automationPrompt.value = '';
    await refreshAutomations();
    add('meta', 'automation created: ' + payload.title);
  } catch (error) {
    add('error', String(error));
  }
}

async function automationAction(id, action) {
  if (action === 'delete' && !confirm('Delete this automation task?')) return;
  try {
    const response = await fetch('/api/automations/' + encodeURIComponent(id) + '?token=' + encodeURIComponent(token), {
      method: action === 'delete' ? 'DELETE' : 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: action === 'delete' ? undefined : JSON.stringify({ action }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      add('error', data.error || ('HTTP ' + response.status));
      return;
    }
    if (action === 'run') add('meta', 'automation started');
    await refreshAutomations();
  } catch (error) {
    add('error', String(error));
  }
}

automationToggle.addEventListener('click', () => {
  automationPanel.hidden = !automationPanel.hidden;
  if (!automationPanel.hidden) {
    modelPanel.hidden = true;
    mcpPanel.hidden = true;
    refreshAutomations();
  }
});
automationClose.addEventListener('click', () => { automationPanel.hidden = true; });
automationNew.addEventListener('click', () => { automationForm.hidden = !automationForm.hidden; if (!automationForm.hidden) automationTitle.focus(); });
automationCancel.addEventListener('click', () => { automationForm.hidden = true; });
automationForm.addEventListener('submit', createAutomation);
automationSearch.addEventListener('input', renderAutomations);
automationFrequency.addEventListener('change', () => { automationWeekday.hidden = automationFrequency.value !== 'weekly'; });
document.querySelectorAll('.automation-tabs button').forEach((button) => {
  button.addEventListener('click', () => {
    automationTab = button.dataset.tab;
    document.querySelectorAll('.automation-tabs button').forEach((other) => other.classList.toggle('active', other === button));
    renderAutomations();
  });
});

artifactClose.addEventListener('click', () => { artifactPanel.hidden = true; });

function finishToolCard(card, chars, preview) {
  if (!card) return;
  const shown = preview || '';
  const denied = /^(approval denied|web access denied)/i.test(shown);
  const dry = /^DRY-RUN/.test(shown);
  const isError = denied || /^tool error:/i.test(shown) || /\[exit [1-9]/.test(shown);
  card.querySelector('.tool-result').hidden = false;
  card.querySelector('.tool-result-text').textContent = shown + (chars > shown.length ? '\n… (' + chars + ' chars total)' : '');
  registerArtifacts(card, shown);
  const status = card.querySelector('.tool-status');
  status.textContent = denied ? 'denied' : dry ? 'dry-run' : isError ? 'error' : 'done';
  status.classList.add(isError ? 'error' : 'ok');
  card.classList.toggle('tool-error', isError);
  if (isError) card.open = true;
  log.scrollTop = log.scrollHeight;
}

function addApprovalCard(payload) {
  const card = document.createElement('div');
  card.className = 'approval-card';
  card.innerHTML = '<div class="approval-title">⚠ Approval required</div>'
    + '<div class="approval-reason"></div>'
    + '<pre><code></code></pre>'
    + '<div class="approval-actions"><button type="button" data-decision="approve">Approve</button><button type="button" data-decision="deny">Deny</button></div>';
  card.querySelector('.approval-reason').textContent = payload.reason || ('Approval required for ' + (payload.name || 'tool'));
  card.querySelector('code').textContent = prettyJson(payload.arguments || '');
  card.querySelectorAll('button').forEach((button) => {
    button.addEventListener('click', async () => {
      card.classList.add('resolved');
      card.querySelectorAll('button').forEach((other) => {
        other.disabled = true;
        if (other !== button) other.style.display = 'none';
      });
      const approved = button.dataset.decision === 'approve';
      button.textContent = approved ? 'Approved' : 'Denied';
      setStatus(approved ? 'thinking' : 'denied');
      try {
        const response = await fetch('/api/approval?token=' + encodeURIComponent(token), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: payload.id, decision: approved }),
        });
        if (!response.ok) {
          add('error', await response.text());
        } else {
          card.remove();
        }
      } catch (error) {
        add('error', String(error));
      }
    });
  });
  if (openTool && openTool.parentNode === log) {
    log.insertBefore(card, openTool);
  } else {
    log.appendChild(card);
  }
  log.scrollTop = log.scrollHeight;
  setStatus('waiting for approval');
}

function handleBlock(block) {
  let event = 'message';
  let data = '';
  for (const raw of block.split('\n')) {
    const line = raw.replace(/\r$/, '');
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return;
  let payload;
  try { payload = JSON.parse(data); } catch { return; }

  if (event === 'session') {
    currentSessionId = payload.session;
  } else if (event === 'token') {
    if (!assistantEl) assistantEl = add('assistant');
    assistantEl.dataset.raw = (assistantEl.dataset.raw || '') + payload.text;
    assistantEl.innerHTML = renderMarkdown(assistantEl.dataset.raw);
    enhanceAssistant(assistantEl);
  } else if (event === 'queued') {
    setStatus(payload.position > payload.slots ? 'queued #' + payload.position : 'starting');
  } else if (event === 'step') {
    setStatus('step ' + payload.step);
  } else if (event === 'tool_call') {
    openTool = addToolCard(payload.name, payload.arguments);
    assistantEl = null;
  } else if (event === 'tool_result') {
    finishToolCard(openTool, payload.chars, payload.preview);
    openTool = null;
  } else if (event === 'notice') {
    add('meta', payload.message);
  } else if (event === 'approval') {
    addApprovalCard(payload);
    assistantEl = null;
  } else if (event === 'done') {
    finished = true;
    if (assistantEl) renderInlineArtifacts(assistantEl, assistantEl.dataset.raw || '');
    currentSessionId = payload.session;
    const cached = payload.cached_tokens ? ' · ' + payload.cached_tokens + ' cached' : '';
    add('meta', 'session ' + payload.session + ' · ' + payload.prompt_tokens + '→' + payload.completion_tokens + ' tokens' + cached);
    setStatus('ready');
    assistantEl = null;
    openTool = null;
    if (!historyPanel.hidden) refreshSessions();
  } else if (event === 'error') {
    add('error', payload.message);
    setStatus('error', true);
    assistantEl = null;
    openTool = null;
  }
  log.scrollTop = log.scrollHeight;
}

let skillCatalog = [];

async function refreshSkills() {
  if (!token) return;
  try {
    const response = await fetch('/api/skills?token=' + encodeURIComponent(token));
    if (!response.ok) return;
    const data = await response.json();
    skillCatalog = data.skills || [];
  } catch (error) {
    skillCatalog = [];
  }
}

function hideSkillMenu() {
  skillMenu.hidden = true;
  skillMenu.innerHTML = '';
}

function updateSkillMenu() {
  const before = promptEl.value.slice(0, promptEl.selectionStart);
  const match = before.match(/@([A-Za-z0-9_-]*)$/);
  if (!match) {
    hideSkillMenu();
    return;
  }
  const query = match[1].toLowerCase();
  const matches = skillCatalog.filter((skill) => {
    return !query || skill.name.toLowerCase().includes(query)
      || (skill.description || '').toLowerCase().includes(query);
  }).slice(0, 8);
  if (!matches.length) {
    hideSkillMenu();
    return;
  }
  skillMenu.innerHTML = '';
  for (const skill of matches) {
    const option = document.createElement('button');
    option.type = 'button';
    option.className = 'skill-option';
    const name = document.createElement('strong');
    name.textContent = '@' + skill.name;
    const description = document.createElement('span');
    description.textContent = skill.description || '';
    option.append(name, description);
    option.addEventListener('mousedown', (event) => {
      event.preventDefault();
      const start = promptEl.selectionStart - match[0].length;
      promptEl.setRangeText('@' + skill.name + ' ', start, promptEl.selectionStart, 'end');
      hideSkillMenu();
      promptEl.focus();
    });
    skillMenu.appendChild(option);
  }
  skillMenu.hidden = false;
}

async function send() {
  const text = promptEl.value;
  if (!text.trim() || !token) return;
  if (controller) {
    queuedPrompts.push(text);
    promptEl.value = '';
    autoGrowPrompt();
    add('meta', 'queued message (' + queuedPrompts.length + ') — Ctrl+Enter steers immediately');
    return;
  }
  if (sendEl.disabled) return;
  addUserMessage(text);
  promptEl.value = '';
  autoGrowPrompt();
  sendEl.disabled = true;
  stopEl.disabled = false;
  controller = new AbortController();
  sendEl.disabled = false;
  setStatus('thinking');
  assistantEl = null;
  openTool = null;
  finished = false;

  try {
    const response = await fetch('/api/chat?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text, session: currentSessionId, workspace: currentSessionId ? null : currentWorkspaceId }),
      signal: controller.signal,
    });
    if (!response.ok) {
      add('error', await response.text());
      setStatus('error', true);
      return;
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let index;
      while ((index = buffer.indexOf('\n\n')) >= 0) {
        const block = buffer.slice(0, index);
        buffer = buffer.slice(index + 2);
        handleBlock(block);
      }
    }
  } catch (error) {
    if (error.name === 'AbortError') {
      add('meta', 'stopped');
      setStatus('stopped');
    } else {
      add('error', String(error));
      setStatus('error', true);
    }
  } finally {
    controller = null;
    stopEl.disabled = true;
    if (!historyPanel.hidden) refreshSessions();
    sendEl.disabled = false;
    if (!finished) setStatus('ready');
    finished = false;
    promptEl.focus();
    if (queuedPrompts.length) {
      const next = queuedPrompts.shift();
      promptEl.value = next;
      autoGrowPrompt();
      send();
    }
  }
}

form.addEventListener('submit', (event) => {
  event.preventDefault();
  if (!currentSessionId && !currentWorkspaceId) {
    add('meta', 'Select a workspace before sending a message.');
    setSidebar(true);
    return;
  }
  send();
});
stopEl.addEventListener('click', () => { if (controller) controller.abort(); });
promptEl.addEventListener('input', updateSkillMenu);
promptEl.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') { hideSkillMenu(); return; }
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    if (controller && event.ctrlKey) {
      const text = promptEl.value;
      if (text.trim()) {
        queuedPrompts.unshift(text);
        promptEl.value = '';
        autoGrowPrompt();
        controller.abort();
      }
      return;
    }
    send();
  }
});
</script>
