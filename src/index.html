<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Harness</title>
<style>
:root { color-scheme: dark; --bg:#111; --panel:#1a1a1a; --text:#e8e8e8; --muted:#9a9a9a; --accent:#6ea8fe; --border:#2a2a2a;
--code-bg:#0d0d0d; --code-text:#e6e6e6; --code-comment:#8b949e; --code-keyword:#ff7b72; --code-string:#a5d6ff; --code-number:#79c0ff; --code-title:#d2a8ff; --code-type:#ffa657; --code-builtin:#79c0ff; --code-meta:#d2a8ff; --code-attr:#79c0ff; --code-tag:#7ee787; --code-regexp:#ffa657; --code-variable:#ffa657; --code-addition:#aff5b4; --code-deletion:#ffdcd7; --ok:#68d391; }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.5 ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
header { padding:12px 18px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; }
header h1 { font-size:14px; font-weight:600; margin:0; }
#status { color:var(--muted); font-size:14px; margin-left:auto; }
#status.error { color:#ff6b6b; }
#log { flex:1; overflow:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
.bubble { max-width:min(760px, 92%); padding:10px 12px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
.user { align-self:flex-end; background:var(--panel); border:1px solid var(--border); color:var(--text); font-size:17px; }
.assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--border); white-space:normal; }
.tool { align-self:flex-start; font:12px ui-monospace, monospace; color:var(--muted); background:#151515; border:1px dashed var(--border); padding:4px 8px; border-radius:6px; max-width:92%; white-space:pre-wrap; }
.meta { align-self:flex-start; color:var(--muted); font-size:14px; }
.error { align-self:flex-start; color:#ffb3b3; background:#2a1515; border:1px solid #5a2a2a; padding:8px 10px; border-radius:8px; white-space:pre-wrap; }
.assistant pre { position:relative; }
.assistant table { border-collapse:collapse; margin:0 0 8px; display:block; overflow:auto; }
.assistant th, .assistant td { border:1px solid var(--border); padding:4px 8px; }
.assistant th { background:#1f1f1f; }
.assistant blockquote { margin:0 0 8px; padding-left:10px; border-left:2px solid var(--border); color:var(--muted); }
.assistant a { color:var(--accent); }
.assistant hr { border:0; border-top:1px solid var(--border); margin:10px 0; }
.copy-btn { position:absolute; top:4px; right:4px; background:#2a2a2a; color:var(--muted); border:1px solid var(--border); border-radius:4px; font-size:10px; padding:2px 6px; cursor:pointer; opacity:0; transition:opacity .15s; }
.assistant pre:hover .copy-btn, .copy-btn:focus { opacity:1; }
.tool-card { align-self:flex-start; width:min(760px,92%); background:var(--panel); border:1px solid var(--border); border-radius:8px; font:13px ui-monospace, monospace; color:var(--muted); }
.tool-card summary { cursor:pointer; padding:6px 10px; color:var(--text); }
.tool-card[open] summary { border-bottom:1px solid var(--border); }
.tool-card summary { font-size:14px; }
.tool-card summary code { color:var(--accent); }
.tool-status { font-size:12px; color:var(--muted); margin-left:6px; }
.tool-status.ok { color:var(--ok); font-weight:600; }
.tool-status.error { color:#fc8181; }
.tool-block { padding:6px 10px; }
.tool-label { text-transform:uppercase; font-size:11px; letter-spacing:.08em; color:var(--muted); margin-bottom:2px; display:flex; justify-content:space-between; align-items:center; gap:6px; user-select:none; }
.tool-buttons { display:flex; flex-wrap:wrap; gap:5px; user-select:none; }
.tool-card summary { user-select:none; }
.tool-result-text { font-size:14px; }
.tool-card pre { margin:0; background:var(--code-bg); color:var(--code-text); border:1px solid var(--border); border-radius:6px; padding:8px; max-height:320px; overflow:auto; white-space:pre-wrap; }
.tool-copy { float:none; text-transform:none; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:5px; font-size:14px; padding:4px 10px; cursor:pointer; }
.approval-card.resolved { opacity:.85; }
.approval-card { align-self:flex-start; width:min(760px,92%); background:#211a12; border:1px solid #6b4e1f; border-radius:8px; padding:10px; }
.approval-title { color:#f6c177; font-weight:600; margin-bottom:4px; }
.approval-reason { color:var(--muted); font-size:13px; margin-bottom:6px; }
.approval-card pre { margin:0 0 8px; background:var(--code-bg); color:var(--code-text); border:1px solid var(--border); border-radius:6px; padding:8px; white-space:pre-wrap; max-height:240px; overflow:auto; }
.approval-actions { display:flex; gap:8px; }
.approval-actions button { padding:5px 12px; border:0; border-radius:6px; cursor:pointer; font-weight:600; }
.approval-actions button[data-decision="approve"] { background:#68d391; color:#08110c; }
.approval-actions button[data-decision="deny"] { background:#3a3a3a; color:var(--text); }
.approval-actions button:disabled { opacity:.5; cursor:default; }
#stop, #send { padding:0 12px; }
#stop:disabled { background:var(--panel); color:var(--text); border:1px solid var(--border); opacity:1; }
textarea::placeholder { color:var(--muted); opacity:1; }
#spell { background:#3a3a3a; color:var(--text); padding:0 12px; }
#spell.active { background:var(--accent); color:#08111f; }
header select { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 6px; font:inherit; font-size:12px; }
form { border-top:1px solid var(--border); padding:12px; display:flex; gap:10px; background:var(--panel); }
#editor { position:relative; flex:1; display:flex; font-size:16px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
#editor:focus-within { border-color:var(--accent); }
#editor textarea { position:relative; z-index:1; flex:1; resize:none; background:transparent; color:var(--text); border:0; padding:10px; font:inherit; line-height:1.5; min-height:44px; max-height:180px; white-space:pre-wrap; overflow-wrap:break-word; scrollbar-width:none; }
#editor textarea::-webkit-scrollbar { display:none; }
#spell-layer { position:absolute; inset:0; z-index:0; padding:10px; font:inherit; line-height:1.5; white-space:pre-wrap; overflow-wrap:break-word; color:transparent; pointer-events:none; overflow:hidden; }
#spell-layer mark { background:transparent; color:transparent; border-bottom:2px solid #e5534b; }
#spell-menu { position:fixed; z-index:100; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:4px; min-width:160px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
#spell-menu button { display:block; width:100%; text-align:left; background:none; color:var(--text); border:0; border-radius:4px; padding:5px 8px; cursor:pointer; }
#spell-menu button:hover { background:var(--bg); }
#spell-menu button:disabled { opacity:.45; cursor:default; }
.emoji-grid { display:grid; grid-template-columns:repeat(8, 32px); gap:2px; max-height:220px; overflow:auto; padding:4px; }
#spell-menu .emoji-grid button { width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:19px; padding:0; }
.spell-menu-sep { height:1px; background:var(--border); margin:4px 2px; }
.spell-menu-title { font-size:11px; color:var(--muted); padding:3px 8px; }
.spell-menu-empty { font-size:12px; color:var(--muted); padding:4px 8px; }
button { background:var(--accent); color:#08111f; border:0; border-radius:8px; padding:0 18px; font-weight:600; cursor:pointer; }
button:disabled { opacity:.5; cursor:default; }
#stop, #send { padding:0 12px; }
#stop:disabled { background:var(--panel); color:var(--text); border:1px solid var(--border); opacity:1; }
textarea::placeholder { color:var(--muted); opacity:1; }
#stop { background:#3a3a3a; color:var(--text); }
.assistant pre { background:var(--code-bg); border:1px solid var(--border); border-radius:6px; padding:8px; overflow:auto; white-space:pre; }
.assistant code { font-family: ui-monospace, monospace; background:var(--code-bg); color:var(--code-text); padding:1px 4px; border-radius:4px; }
.assistant pre code { background:none; padding:0; }
pre code.hljs { background:var(--code-bg); color:var(--code-text); }
.hljs-comment, .hljs-quote { color:var(--code-comment); }
.hljs-keyword, .hljs-selector-tag, .hljs-literal { color:var(--code-keyword); }
.hljs-string, .hljs-doctag { color:var(--code-string); }
.hljs-number, .hljs-symbol, .hljs-bullet { color:var(--code-number); }
.hljs-title, .hljs-section, .hljs-function .hljs-title { color:var(--code-title); }
.hljs-type, .hljs-class .hljs-title { color:var(--code-type); }
.hljs-built_in, .hljs-builtin-name { color:var(--code-builtin); }
.hljs-meta, .hljs-meta .hljs-keyword { color:var(--code-meta); }
.hljs-attr, .hljs-attribute { color:var(--code-attr); }
.hljs-tag, .hljs-name, .hljs-selector-id, .hljs-selector-class { color:var(--code-tag); }
.hljs-regexp { color:var(--code-regexp); }
.hljs-variable, .hljs-template-variable { color:var(--code-variable); }
.hljs-addition { color:var(--code-addition); }
.hljs-deletion { color:var(--code-deletion); }
.assistant p { margin:0 0 8px; }
.assistant p:last-child { margin-bottom:0; }
.assistant h1, .assistant h2, .assistant h3 { margin:10px 0 6px; line-height:1.25; }
.assistant h1 { font-size:1.3em; }
.assistant h2 { font-size:1.15em; }
.assistant h3 { font-size:1.05em; }
.assistant ul, .assistant ol { margin:0 0 8px 1.3em; padding:0; }
.assistant li { margin:2px 0; }
</style>
<link rel="stylesheet" href="/assets/highlight.css">
</head>
<body>
<header><h1>Local Harness</h1>
<select id="theme" title="Theme">
<option value="dark">Dark</option>
<option value="midnight">Midnight</option>
<option value="solarized">Solarized</option>
<option value="golden-sand">Golden Sand</option>
</select>
<select id="scale" title="Interface scale">
<option value="0.8">80%</option>
<option value="0.9">90%</option>
<option value="1" selected>100%</option>
<option value="1.1">110%</option>
<option value="1.25">125%</option>
<option value="1.5">150%</option>
</select>
<span id="status">ready</span></header>
<main id="log"></main>
<form id="form">
<div id="editor"><div id="spell-layer" aria-hidden="true"></div>
<textarea id="prompt" spellcheck="false" lang="en-AU" autocorrect="on" autocapitalize="sentences" placeholder="Ask the local model… (Enter to send, Shift+Enter for a newline)" autofocus></textarea></div>
<button id="spell" type="button" title="Toggle spellcheck">Spell</button>
<button id="stop" type="button" disabled>Stop</button>
<button id="send" type="submit">Send</button>
</form>
<div id="spell-menu" hidden></div>
<script src="/assets/typo.js"></script>
<script src="/assets/markdown-it.min.js"></script>
<script src="/assets/highlight.min.js"></script>
<script src="/assets/purify.min.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const form = document.getElementById('form');
const promptEl = document.getElementById('prompt');
const sendEl = document.getElementById('send');
const stopEl = document.getElementById('stop');
const themeEl = document.getElementById('theme');
const spellEl = document.getElementById('spell');
const scaleEl = document.getElementById('scale');

let controller = null;

let assistantEl = null;
let openTool = null;
let finished = false;

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.className = isError ? 'error' : '';
}

function add(className, text = '') {
  const element = document.createElement('div');
  element.className = className;
  element.textContent = text;
  log.appendChild(element);
  log.scrollTop = log.scrollHeight;
  return element;
}

if (!token) setStatus('missing token in URL', true);

const darkCode = { bg: '#0d0d0d', text: '#e6e6e6', comment: '#8b949e', keyword: '#ff7b72', string: '#a5d6ff', number: '#79c0ff', title: '#d2a8ff', type: '#ffa657', builtin: '#79c0ff', meta: '#d2a8ff', attr: '#79c0ff', tag: '#7ee787', regexp: '#ffa657', variable: '#ffa657', addition: '#aff5b4', deletion: '#ffdcd7' };

const themes = {
  dark: { bg: '#111111', panel: '#1a1a1a', text: '#e8e8e8', muted: '#9a9a9a', border: '#2a2a2a', accent: '#6ea8fe', scheme: 'dark', ok: '#68d391', code: darkCode },
  midnight: { bg: '#0b1220', panel: '#111a2b', text: '#e6edf7', muted: '#8fa3bf', border: '#1f2b40', accent: '#6ea8fe', scheme: 'dark', ok: '#68d391', code: darkCode },
  solarized: { bg: '#002b36', panel: '#073642', text: '#eee8d5', muted: '#93a1a1', border: '#0f4b59', accent: '#268BD2', scheme: 'dark', ok: '#859900', code: darkCode },
  'golden-sand': { bg: '#F8E7B7', panel: '#F6EFDC', text: '#073642', muted: '#586E75', border: '#D9C79C', accent: '#268BD2', scheme: 'light', ok: '#2f6b3a', code: {
    bg: '#F6EFDC', text: '#073642', comment: '#657B83', keyword: '#CB4B16', string: '#2AA198', number: '#2AA198', title: '#268BD2', type: '#B58900', builtin: '#268BD2', meta: '#6C71C4', attr: '#B58900', tag: '#268BD2', regexp: '#DC322F', variable: '#073642', addition: '#859900', deletion: '#DC322F'
  } }
};

function applyTheme(name) {
  if (!themes[name]) name = 'dark';
  const theme = themes[name];
  const root = document.documentElement;
  root.style.setProperty('--bg', theme.bg);
  root.style.setProperty('--panel', theme.panel);
  root.style.setProperty('--text', theme.text);
  root.style.setProperty('--muted', theme.muted);
  root.style.setProperty('--border', theme.border);
  root.style.setProperty('--accent', theme.accent);
  root.style.setProperty('--ok', theme.ok || '#68d391');
  root.style.colorScheme = theme.scheme;
  const code = theme.code || darkCode;
  for (const [key, value] of Object.entries(code)) {
    root.style.setProperty('--code-' + key, value);
  }
  themeEl.value = name;
  localStorage.setItem('localHarnessTheme', name);
}

themeEl.addEventListener('change', () => applyTheme(themeEl.value));
applyTheme(localStorage.getItem('localHarnessTheme') || 'dark');

function applyScale(value) {
  const scale = parseFloat(value) || 1;
  document.documentElement.style.setProperty('--ui-scale', String(scale));
  document.body.style.zoom = String(scale);
  document.body.style.width = 'calc(100vw / ' + scale + ')';
  document.body.style.height = 'calc(100vh / ' + scale + ')';
  scaleEl.value = String(scale);
  localStorage.setItem('localHarnessScale', String(scale));
}

scaleEl.addEventListener('change', () => applyScale(scaleEl.value));
applyScale(localStorage.getItem('localHarnessScale') || '1');

const spellLayer = document.getElementById('spell-layer');
const spellMenu = document.getElementById('spell-menu');
const spellIgnore = new Set([
  'ls','cd','git','rg','sed','awk','grep','cat','cp','mv','rm','find','sudo','dnf',
  'flatpak','cargo','rustc','npm','pnpm','ssh','scp','curl','wget','tar','xz','zip',
  'unzip','chmod','chown','mkdir','rmdir','touch','echo','printf','env','export',
  'source','bash','sh','zsh','fish','python','python3','node','deno','bun','podman',
  'docker','systemctl','journalctl','rpm','ostree','localhost','http','https'
]);
let spellDictionary = null;
let spellcheckEnabled = localStorage.getItem('localHarnessSpellcheck') !== '0';
let spellTimer = null;

async function loadSpellDictionary() {
  try {
    const [aff, dic] = await Promise.all([
      fetch('/assets/en_AU.aff').then((response) => { if (!response.ok) throw new Error('aff ' + response.status); return response.text(); }),
      fetch('/assets/en_AU.dic').then((response) => { if (!response.ok) throw new Error('dic ' + response.status); return response.text(); })
    ]);
    spellDictionary = new Typo('en_AU', aff, dic, { platform: 'any' });
    if (spellcheckEnabled) renderSpellLayer();
  } catch (error) {
    console.error('spellcheck dictionary failed', error);
  }
}

function skipSpellWord(word) {
  return word.length <= 2 || spellIgnore.has(word.toLowerCase());
}

function renderSpellLayer() {
  if (!spellcheckEnabled || !spellDictionary) {
    spellLayer.innerHTML = '';
    return;
  }
  const text = promptEl.value;
  const pattern = /[A-Za-z][A-Za-z'’-]*/g;
  let html = '';
  let last = 0;
  let match;
  while ((match = pattern.exec(text)) !== null) {
    const word = match[0];
    if (skipSpellWord(word) || spellDictionary.check(word)) continue;
    html += escapeHtml(text.slice(last, match.index));
    html += '<mark data-start="' + match.index + '" data-end="' + (match.index + word.length) + '">' + escapeHtml(word) + '</mark>';
    last = match.index + word.length;
  }
  html += escapeHtml(text.slice(last));
  spellLayer.innerHTML = html + (text.endsWith('\n') ? ' ' : '');
  spellLayer.scrollTop = promptEl.scrollTop;
}

function scheduleSpell() {
  if (!spellcheckEnabled) {
    spellLayer.innerHTML = '';
    return;
  }
  clearTimeout(spellTimer);
  spellTimer = setTimeout(renderSpellLayer, 180);
}

let spellMenuOpenedAt = 0;

function hideSpellMenu() {
  if (!spellMenu) return;
  spellMenu.hidden = true;
  spellMenu.style.display = 'none';
}

function menuButton(label, action, disabled) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label;
  button.disabled = Boolean(disabled);
  button.addEventListener('click', () => {
    hideSpellMenu();
    Promise.resolve(action()).catch(() => {});
  });
  spellMenu.appendChild(button);
}

function menuSeparator() {
  const separator = document.createElement('div');
  separator.className = 'spell-menu-sep';
  spellMenu.appendChild(separator);
}

async function writeClipboard(text) {
  if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (error) {}
  }
  try {
    const scratch = document.createElement('textarea');
    scratch.value = text;
    document.body.appendChild(scratch);
    scratch.select();
    const ok = document.execCommand('copy');
    scratch.remove();
    return ok;
  } catch (error) {
    return false;
  }
}

function showEmojiPicker(start, end, x, y) {
  if (!spellMenu) return;
  spellMenu.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'spell-menu-title';
  title.textContent = 'Insert emoji';
  spellMenu.appendChild(title);
  const grid = document.createElement('div');
  grid.className = 'emoji-grid';
  const emojis = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','😉','😍','🥰','😘','😎','🤔','🤨','😐','😑','😶','🙄','😏','😣','😥','😮','🤐','😯','😪','😫','🥱','😴','😌','😛','😜','🤪','😝','🤗','🤭','🫢','🫣','🤫','🫡','😬','😯','😦','😧','😨','😰','😥','😲','🥺','😢','😭','😱','😖','😞','😓','😩','😤','😡','😠','🤬','😈','👿','💀','💩','🤡','👻','👽','🤖','😺','😸','😹','😻','😼','😽','🙀','😿','😾'];
  emojis.forEach((emoji) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = emoji;
    button.addEventListener('click', () => {
      promptEl.setRangeText(emoji, start, end, 'end');
      promptEl.dispatchEvent(new Event('input'));
      hideSpellMenu();
      promptEl.focus();
    });
    grid.appendChild(button);
  });
  spellMenu.appendChild(grid);
  const width = spellMenu.offsetWidth || 280;
  const height = spellMenu.offsetHeight || 300;
  spellMenu.style.left = Math.max(8, Math.min(x, window.innerWidth - width - 8)) + 'px';
  spellMenu.style.top = Math.max(8, Math.min(y, window.innerHeight - height - 8)) + 'px';
  spellMenuOpenedAt = Date.now();
}

function showContextMenu(x, y, spelling) {
  if (!spellMenu) return;
  if (spellMenu.parentElement !== document.body) document.body.appendChild(spellMenu);
  spellMenu.innerHTML = '';
  if (spelling) {
    const title = document.createElement('div');
    title.className = 'spell-menu-title';
    title.textContent = spelling.word;
    spellMenu.appendChild(title);
    let suggestions = [];
    try { suggestions = spellDictionary.suggest(spelling.word, 6); } catch (error) {}
    if (!suggestions.length) {
      const empty = document.createElement('div');
      empty.className = 'spell-menu-empty';
      empty.textContent = 'No suggestions';
      spellMenu.appendChild(empty);
    }
    suggestions.forEach((suggestion) => {
      menuButton(suggestion, () => {
        promptEl.setRangeText(suggestion, spelling.start, spelling.end, 'end');
        promptEl.dispatchEvent(new Event('input'));
        promptEl.focus();
      });
    });
    menuSeparator();
  }

  const start = promptEl.selectionStart;
  const end = promptEl.selectionEnd;
  const selected = promptEl.value.slice(start, end);
  const hasSelection = end > start;
  const canClipboard = Boolean(navigator.clipboard);

  menuButton('Cut', async () => {
    if (await writeClipboard(selected)) {
      promptEl.setRangeText('', start, end, 'end');
      promptEl.dispatchEvent(new Event('input'));
      promptEl.focus();
    }
  }, !hasSelection);
  menuButton('Copy', () => writeClipboard(selected), !hasSelection);
  menuButton('Paste', async () => {
    if (!navigator.clipboard) return;
    try {
      const text = await navigator.clipboard.readText();
      promptEl.setRangeText(text, start, end, 'end');
      promptEl.dispatchEvent(new Event('input'));
      promptEl.focus();
    } catch (error) {}
  }, !canClipboard);
  menuButton('Delete', () => {
    promptEl.setRangeText('', start, end, 'end');
    promptEl.dispatchEvent(new Event('input'));
    promptEl.focus();
  }, !hasSelection);
  menuSeparator();
  menuButton('Select all', () => {
    promptEl.select();
    promptEl.focus();
  });
  menuSeparator();
  const emojiButton = document.createElement('button');
  emojiButton.type = 'button';
  emojiButton.textContent = 'Insert emoji';
  emojiButton.addEventListener('click', () => showEmojiPicker(start, end, x, y));
  spellMenu.appendChild(emojiButton);

  spellMenu.removeAttribute('hidden');
  spellMenu.style.position = 'fixed';
  spellMenu.style.display = 'block';
  spellMenu.style.visibility = 'visible';
  spellMenu.style.opacity = '1';
  spellMenu.style.zIndex = '10000';
  const width = spellMenu.offsetWidth || 220;
  const height = spellMenu.offsetHeight || 300;
  spellMenu.style.left = Math.max(8, Math.min(x, window.innerWidth - width - 8)) + 'px';
  spellMenu.style.top = Math.max(8, Math.min(y, window.innerHeight - height - 8)) + 'px';
  spellMenuOpenedAt = Date.now();
}

function firstMisspelling() {
  const text = promptEl.value;
  const pattern = /[A-Za-z][A-Za-z'’-]*/g;
  let match;
  while ((match = pattern.exec(text)) !== null) {
    if (!skipSpellWord(match[0]) && !spellDictionary.check(match[0])) {
      return { word: match[0], start: match.index, end: match.index + match[0].length };
    }
  }
  return null;
}

function spellingAt(x, y, allowFallback) {
  if (!spellcheckEnabled || !spellDictionary) return null;
  renderSpellLayer();
  const marks = Array.from(spellLayer.querySelectorAll('mark'));
  let mark = marks.find((candidate) => {
    const rect = candidate.getBoundingClientRect();
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  });
  if (!mark && allowFallback && marks.length) {
    mark = marks.map((candidate) => {
      const rect = candidate.getBoundingClientRect();
      const dx = Math.max(rect.left - x, 0, x - rect.right);
      const dy = Math.max(rect.top - y, 0, y - rect.bottom);
      return { candidate, distance: dx * dx + dy * dy };
    }).sort((a, b) => a.distance - b.distance)[0].candidate;
  }
  if (mark) {
    return { word: mark.textContent, start: Number(mark.dataset.start), end: Number(mark.dataset.end) };
  }
  return allowFallback ? firstMisspelling() : null;
}

promptEl.addEventListener('input', scheduleSpell);
promptEl.addEventListener('scroll', () => { spellLayer.scrollTop = promptEl.scrollTop; });
window.addEventListener('resize', scheduleSpell);
promptEl.addEventListener('contextmenu', (event) => {
  try {
    showContextMenu(event.clientX, event.clientY, spellingAt(event.clientX, event.clientY, true));
    event.preventDefault();
    event.stopPropagation();
  } catch (error) {
    console.error('context menu failed', error);
    hideSpellMenu();
  }
});
promptEl.addEventListener('click', (event) => {
  if (event.button !== 0) return;
  try {
    const spelling = spellingAt(event.clientX, event.clientY, false);
    if (spelling) showContextMenu(event.clientX, event.clientY, spelling);
  } catch (error) {
    console.error('spell menu failed', error);
  }
});
document.addEventListener('mousedown', (event) => {
  if (event.button !== 0) return;
  if (spellMenu.contains(event.target)) return;
  if (Date.now() - spellMenuOpenedAt < 250) return;
  hideSpellMenu();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') hideSpellMenu();
});

function setSpellcheck(enabled) {
  spellcheckEnabled = enabled;
  promptEl.spellcheck = false;
  spellEl.classList.toggle('active', enabled);
  spellEl.textContent = enabled ? 'Spell ✓' : 'Spell';
  localStorage.setItem('localHarnessSpellcheck', enabled ? '1' : '0');
  if (enabled) {
    scheduleSpell();
  } else {
    spellLayer.innerHTML = '';
    hideSpellMenu();
  }
}

spellEl.addEventListener('click', () => setSpellcheck(!spellcheckEnabled));
setSpellcheck(spellcheckEnabled);
loadSpellDictionary();



function escapeHtml(text) {
  return text.replace(/[&<>]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[character]));
}

const md = window.markdownit({
  html: false,
  linkify: true,
  breaks: true,
  highlight: function (str, lang) {
    if (lang && window.hljs && hljs.getLanguage(lang)) {
      try {
        const highlighted = hljs.highlight(str, { language: lang, ignoreIllegals: true }).value;
        return '<pre class="hljs"><code class="hljs language-' + escapeHtml(lang) + '">' + highlighted + '</code></pre>';
      } catch (error) {
        // fall through to plain code
      }
    }
    return '<pre class="hljs"><code class="hljs">' + md.utils.escapeHtml(str) + '</code></pre>';
  }
});

const defaultLinkOpen = md.renderer.rules.link_open ||
  function (tokens, idx, options, env, self) { return self.renderToken(tokens, idx, options); };
md.renderer.rules.link_open = function (tokens, idx, options, env, self) {
  tokens[idx].attrSet('target', '_blank');
  tokens[idx].attrSet('rel', 'noopener noreferrer');
  return defaultLinkOpen(tokens, idx, options, env, self);
};

function renderMarkdown(text) {
  return DOMPurify.sanitize(md.render(text), { ADD_ATTR: ['target'] });
}

function enhanceAssistant(element) {
  element.querySelectorAll('pre').forEach((pre) => {
    if (pre.querySelector('.copy-btn')) return;
    const button = document.createElement('button');
    button.className = 'copy-btn';
    button.type = 'button';
    button.textContent = 'copy';
    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(pre.querySelector('code')?.innerText || pre.innerText);
        button.textContent = 'copied';
        setTimeout(() => { button.textContent = 'copy'; }, 1200);
      } catch (error) {
        button.textContent = 'failed';
      }
    });
    pre.appendChild(button);
  });
}

function prettyJson(value) {
  try { return JSON.stringify(JSON.parse(value), null, 2); } catch { return value; }
}

function copyButton(label, getValue, title) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'tool-copy';
  button.textContent = label;
  if (title) button.title = title;
  button.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(getValue());
      button.textContent = 'copied';
      setTimeout(() => { button.textContent = label; }, 1200);
    } catch (error) {
      button.textContent = 'failed';
    }
  });
  return button;
}

function addToolCard(name, argumentsText) {
  const card = document.createElement('details');
  card.className = 'tool-card';
  card.innerHTML = '<summary>🔧 <code>' + escapeHtml(name) + '</code> <span class="tool-status">running…</span></summary>'
    + '<div class="tool-block"><div class="tool-label">arguments<span class="tool-buttons"></span></div><pre><code class="tool-args"></code></pre></div>'
    + '<div class="tool-block tool-result" hidden><div class="tool-label">result<span class="tool-buttons"></span></div><pre><code class="tool-result-text"></code></pre></div>';
  const commandValue = () => {
    try {
      const parsed = JSON.parse(argumentsText);
      return parsed.command || JSON.stringify(parsed, null, 2);
    } catch (error) {
      return argumentsText;
    }
  };
  card.querySelector('.tool-args').textContent = name === 'bash' ? commandValue() : prettyJson(argumentsText);
  if (name === 'bash') {
    card.querySelector('.tool-block:not(.tool-result) .tool-label').firstChild.textContent = 'command';
  }
  card.querySelector('.tool-block:not(.tool-result) .tool-buttons').appendChild(
    copyButton(name === 'bash' ? 'copy command' : 'copy args', commandValue,
      name === 'bash' ? 'Copy only the command, safe to paste into a shell' : 'Copy the tool arguments')
  );

  const outputValue = () => card.querySelector('.tool-result-text').textContent;
  card.querySelector('.tool-result .tool-buttons').appendChild(
    copyButton('copy output', outputValue, 'Copy raw output. Pasting it into a shell runs the lines as commands.')
  );
  card.querySelector('.tool-result .tool-buttons').appendChild(
    copyButton('copy # comment', () => outputValue().split('\n').map((line) => line ? '# ' + line : '#').join('\n'),
      'Copy output prefixed with #, safe to paste into a shell')
  );

  log.appendChild(card);
  log.scrollTop = log.scrollHeight;
  return card;
}

function finishToolCard(card, chars, preview) {
  if (!card) return;
  const shown = preview || '';
  const denied = /^approval denied/i.test(shown);
  const dry = /^DRY-RUN/.test(shown);
  const isError = denied || /^tool error:/i.test(shown) || /\[exit [1-9]/.test(shown);
  card.querySelector('.tool-result').hidden = false;
  card.querySelector('.tool-result-text').textContent = shown + (chars > shown.length ? '\n… (' + chars + ' chars total)' : '');
  const status = card.querySelector('.tool-status');
  status.textContent = denied ? 'denied' : dry ? 'dry-run' : isError ? 'error' : 'done';
  status.classList.add(isError ? 'error' : 'ok');
  card.classList.toggle('tool-error', isError);
  if (isError) card.open = true;
  log.scrollTop = log.scrollHeight;
}

function handleBlock(block) {
  let event = 'message';
  let data = '';
  for (const raw of block.split('\n')) {
    const line = raw.replace(/\r$/, '');
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return;
  let payload;
  try { payload = JSON.parse(data); } catch { return; }

  if (event === 'token') {
    if (!assistantEl) assistantEl = add('assistant');
    assistantEl.dataset.raw = (assistantEl.dataset.raw || '') + payload.text;
    assistantEl.innerHTML = renderMarkdown(assistantEl.dataset.raw);
    enhanceAssistant(assistantEl);
  } else if (event === 'queued') {
    setStatus(payload.position > payload.slots ? 'queued #' + payload.position : 'starting');
  } else if (event === 'step') {
    setStatus('step ' + payload.step);
  } else if (event === 'tool_call') {
    openTool = addToolCard(payload.name, payload.arguments);
    assistantEl = null;
  } else if (event === 'tool_result') {
    finishToolCard(openTool, payload.chars, payload.preview);
    openTool = null;
  } else if (event === 'notice') {
    add('meta', payload.message);
  } else if (event === 'approval') {
    addApprovalCard(payload);
    assistantEl = null;
  } else if (event === 'done') {
    finished = true;
    const cached = payload.cached_tokens ? ' · ' + payload.cached_tokens + ' cached' : '';
    add('meta', 'session ' + payload.session + ' · ' + payload.prompt_tokens + '→' + payload.completion_tokens + ' tokens' + cached);
    setStatus('ready');
    assistantEl = null;
    openTool = null;
  } else if (event === 'error') {
    add('error', payload.message);
    setStatus('error', true);
    assistantEl = null;
    openTool = null;
  }
  log.scrollTop = log.scrollHeight;
}

async function send() {
  const text = promptEl.value.trim();
  if (!text || !token || sendEl.disabled) return;
  add('user', text);
  promptEl.value = '';
  sendEl.disabled = true;
  stopEl.disabled = false;
  controller = new AbortController();
  setStatus('thinking');
  assistantEl = null;
  openTool = null;
  finished = false;

  try {
    const response = await fetch('/api/chat?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text }),
      signal: controller.signal,
    });
    if (!response.ok) {
      add('error', await response.text());
      setStatus('error', true);
      return;
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let index;
      while ((index = buffer.indexOf('\n\n')) >= 0) {
        const block = buffer.slice(0, index);
        buffer = buffer.slice(index + 2);
        handleBlock(block);
      }
    }
  } catch (error) {
    if (error.name === 'AbortError') {
      add('meta', 'stopped');
      setStatus('stopped');
    } else {
      add('error', String(error));
      setStatus('error', true);
    }
  } finally {
    controller = null;
    stopEl.disabled = true;
    sendEl.disabled = false;
    if (!finished) setStatus('ready');
    finished = false;
    promptEl.focus();
  }
}

form.addEventListener('submit', (event) => { event.preventDefault(); send(); });
stopEl.addEventListener('click', () => { if (controller) controller.abort(); });
promptEl.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); }
});
