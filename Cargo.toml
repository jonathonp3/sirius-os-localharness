[package]
name = "local-harness"
version = "0.1.0"
edition = "2021"
description = "Local-first agent harness (llama.cpp backend, CLI-first)"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
scraper = "0.22"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "time", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
